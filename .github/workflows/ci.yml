name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android build and checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build, lint, detekt, unit tests, coverage gate, screenshots
        run: ./gradlew assembleDebug assembleRelease lint detekt test koverVerify verifyRoborazziDebug --continue

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/roborazzi/
          retention-days: 14

  device-tests:
    name: Device tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Hardware acceleration for the emulator that Gradle Managed Devices starts.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run device tests on the managed emulator (Pixel 6, API 34)
        # One module at a time: each boots its own emulator, and two at once can exhaust the runner's memory.
        run: ./gradlew pixel6Api34DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect --continue --no-parallel

      # Guards against a green job that ran nothing (for example, a module losing its device tests by mistake).
      - name: Summarize device tests
        run: |
          files=$(find . -path '*/build/outputs/androidTest-results/managedDevice/*' -name 'TEST-*.xml')
          if [ -z "$files" ]; then echo "::error::No device test results found"; exit 1; fi
          total=$(cat $files | grep -o '<testcase ' | wc -l)
          failed=$(cat $files | grep -o '<failure' | wc -l)
          echo "Device tests: $total run, $failed failed" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$total" -gt 0 ]

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-test-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 14

  login-helper:
    name: Login helper tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: login-helper
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: login-helper/package-lock.json

      - run: npm ci

      # Type checks, tests, and a dry-run bundle of the staging worker.
      - run: npm run check
        env:
          WRANGLER_SEND_METRICS: "false"

      - run: npm audit --audit-level=high
