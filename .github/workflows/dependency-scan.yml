name: Dependency scan

# OWASP dependency-check over every resolved dependency. Fails on CVSS >= 7.
on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths:
      - gradle/libs.versions.toml
      - build-logic/**
      - "**/build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owasp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::Add a free NVD API key (https://nvd.nist.gov/developers/request-an-api-key) as the repository secret NVD_API_KEY."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore vulnerability database
        uses: actions/cache@v6
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      - name: Scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # Download the database once, then scan each module against it (one at a time: they share the database file).
        run: |
          ./gradlew :dependencyCheckUpdate
          ./gradlew dependencyCheckAnalyze --no-parallel --continue

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: "**/build/reports/dependency-check-report.*"
          retention-days: 30
