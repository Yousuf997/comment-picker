name: Dependency scan

# OWASP dependency-check over every shipped dependency. Fails on CVSS >= 7.
# Vulnerability data comes from the DependencyCheck project's daily NVD mirror (see DependencyCheckConventionPlugin).
on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths:
      - gradle/libs.versions.toml
      - build-logic/**
      - "**/build.gradle.kts"
      - .github/workflows/dependency-scan.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owasp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore vulnerability database
        uses: actions/cache@v6
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      # Download the database once, then scan each module against it (one at a time: they share the database file).
      - name: Scan
        run: |
          ./gradlew :dependencyCheckUpdate
          ./gradlew dependencyCheckAnalyze --no-parallel --continue

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: "**/build/reports/dependency-check/"
          retention-days: 30
