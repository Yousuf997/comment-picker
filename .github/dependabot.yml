version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      android-tooling:
        patterns:
          - "com.android.tools*"
      androidx:
        patterns:
          - "androidx.*"
      dagger:
        patterns:
          - "com.google.dagger*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /login-helper
    schedule:
      interval: weekly
    ignore:
      # Types must match the Node major the tooling runs on (22 in CI).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
