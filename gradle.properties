org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
kotlin.code.style=official

# Sign-in configuration from the F-01 setup. Not secret (the Meta app secret lives only in the login helper).
# Placeholders use the reserved .invalid domain, so nothing can reach a real host by accident.
giveaway.igAppId=REPLACE_WITH_META_APP_ID
giveaway.authHost=auth.example.invalid
# The Meta app ID, sent with Share to Story (Instagram requires it as source_application).
giveaway.metaAppId=REPLACE_WITH_META_APP_ID
# Comma-separated "sha256/..." SPKI pins for the auth host, including a backup pin (plan section 5, step 7).
giveaway.authHostPins=
# Google Cloud project number linked to the app in Play Console, for Play Integrity (F-01). 0 = not set up yet.
giveaway.cloudProjectNumber=0
# Public privacy policy page (spec: Privacy; required by Google Play and Meta).
giveaway.privacyPolicyUrl=https://example.invalid/privacy
# The open draw verifier page printed on certificates (plan decision 5: GitHub Pages).
giveaway.verifierUrl=https://example.invalid/verify
